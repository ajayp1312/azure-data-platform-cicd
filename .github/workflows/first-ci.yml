name: My First CI Pipeline

on:
  workflow_dispatch:

jobs:
  learning-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello Ajay! GitHub Actions is working."

      - name: Show Runner Operating System
        run: uname -a

      - name: Show Current Directory
        run: pwd

      - name: List Repository Files
        run: ls -la

      - name: Finish
        run: echo "My first CI pipeline completed successfully!"