name: Python CI

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Run Employee Processor
        run: |
          python python/employee_processor.py

      - name: Check Generated File
        run: |
          cat employee_output.json

      - name: Upload Employee Artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-output
          path: employee_output.json